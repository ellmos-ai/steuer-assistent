[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steuer-assistent"
version = "0.2.2"
description = "Private Beleg-Arbeitsunterlage für vom Nutzer erfasste Werbungskosten"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []          # stdlib + sqlite3 only
keywords = [
    "steuer",
    "werbungskosten",
    "belege",
    "tax-worksheet",
    "offline-first",
    "privacy-first",
    "elster-helper",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    # Kein "License :: ..."-Classifier: Seit PEP 639 traegt das Feld
    # license = "MIT" oben die Lizenzangabe. Aktuelle setuptools-Versionen
    # brechen die Installation mit InvalidConfigError ab, wenn beides
    # zugleich gesetzt ist.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
]

[tool.setuptools]
# Ohne diese Angabe sucht setuptools die Pakete selbst und findet im
# Wurzelverzeichnis zwei Kandidaten (assets/ neben steuer_assistent/).
# Bei mehreren Top-Level-Verzeichnissen bricht die Flat-Layout-Erkennung
# ab: "Multiple top-level packages discovered in a flat-layout".
# assets/ enthaelt nur das README-Banner und gehoert nicht ins Paket.
packages = ["steuer_assistent"]

[project.urls]
Homepage = "https://github.com/ellmos-ai/steuer-assistent"
Repository = "https://github.com/ellmos-ai/steuer-assistent.git"
Issues = "https://github.com/ellmos-ai/steuer-assistent/issues"

[project.scripts]
steuer-assistent = "steuer_assistent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
