[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steuer-assistent"
version = "0.2.0"
description = "Private Beleg-Arbeitsunterlage für vom Nutzer erfasste Werbungskosten"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []          # stdlib + sqlite3 only

[project.scripts]
steuer-assistent = "steuer_assistent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
